services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["rag_index:/app/data/index"]
  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["rag_index:/app/data/index"]
volumes:
  rag_index:
